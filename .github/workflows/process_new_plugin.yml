name: Process New PackIt Plugins

on:
  push:
    paths:
      - 'plugins/*.plugin'

permissions:
  contents: write

jobs:
  process-plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Plugin Files
        id: process
        env:
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMRTUXD ${{ github.event.before }} ${{ github.sha }} | grep '^plugins/.*\.plugin$' || true)
          if [ -z "$FILES" ]; then
            FILES=$(git show --name-only --diff-filter=ACMRTUXD --pretty="" ${{ github.sha }} | grep '^plugins/.*\.plugin$' || true)
          fi
          if [ -n "$FILES" ]; then
            python packit/process_new_plugin.py $FILES
          fi

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add packit/plugins.json
          if git diff --staged --quiet; then
            echo "INFO: No changes to commit in packit/plugins.json"
          else
            if [ -f /tmp/commit_msg.txt ]; then
              git commit -F /tmp/commit_msg.txt
              git push origin main
            fi
          fi
