name: Process New Plugins

on:
  push:
    paths:
      - 'plugins/*.plugin'

permissions:
  contents: write

jobs:
  detect-plugins:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has_files: ${{ steps.set-matrix.outputs.has_files }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect added/modified plugin files
        id: set-matrix
        run: |
          FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.before }} ${{ github.sha }} | grep '^plugins/.*\.plugin$' || true)
          if [ -z "$FILES" ]; then
            FILES=$(git show --name-only --diff-filter=AM --pretty="" ${{ github.sha }} | grep '^plugins/.*\.plugin$' || true)
          fi
          
          if [ -z "$FILES" ]; then
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "matrix=[]" >> $GITHUB_OUTPUT
          else
            JSON_ARRAY=$(echo "$FILES" | jq -R . | jq -s -c .)
            echo "has_files=true" >> $GITHUB_OUTPUT
            echo "matrix=$JSON_ARRAY" >> $GITHUB_OUTPUT
          fi

  process-plugins:
    needs: detect-plugins
    if: ${{ needs.detect-plugins.outputs.has_files == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        file: ${{ fromJson(needs.detect-plugins.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Process Plugin File
        id: process
        run: |
          python packit/process_new_plugin.py "${{ matrix.file }}"

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add packit/plugins.json
          if git diff --staged --quiet; then
            echo "INFO: No changes to commit in packit/plugins.json"
          else
            git commit -m "${{ steps.process.outputs.commit_message }}"
            git push origin main
          fi
